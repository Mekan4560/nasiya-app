}
:root[data-theme="dark"]{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;padding-bottom:calc(90px + env(safe-area-inset-bottom))}

.hero{background:var(--hero);color:#fff;padding:16px 16px 18px;

.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero small{opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.6px}

.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:2px;flex:none}

.hero .big{font-family:var(--display);font-size:30px;line-height:1.15;margin:10px 0 12px}

.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;opacity:.85}

.tabs{display:flex;gap:6px;padding:12px 16px 4px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.search{margin:10px 16px 6px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:10px 0;outline:none;color:var(--ink)}
.chips{display:flex;gap:6px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}

.list{padding:0 16px;display:flex;flex-direction:column;gap:8px}

.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.row .t{min-width:0}

.row .t small{color:var(--muted);font-size:12px}
.amt{font-weight:700;text-align:right}
.amt.d{color:var(--red)} .amt.z{color:var(--green)}

.empty{text-align:center;color:var(--muted);padding:30px 16px}
.fab{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));border:0;background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(27,36,64,.25);z-index:4}

.cust-head h2{margin:0;font-size:19px;overflow-wrap:anywhere}

.cust-head .bal.d{color:var(--red)} .cust-head .bal.z{color:var(--green)}

.rep{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.box h3{margin:0 0 8px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}

.kv span{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin-top:6px}
.bar{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}

.bar i{display:block;width:9px;border-radius:3px 3px 0 0;min-height:1px}

.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:8}

.link{font-size:13px;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px}

@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 12px 9px 14px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;display:flex;gap:10px;align-items:center;max-width:92%}
.toast.err{background:var(--red);color:#fff}
.toast button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:8px;padding:4px 10px;font-weight:700}

.claims h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}

.claim .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.claim .top b{min-width:0;overflow-wrap:anywhere}
.claim .top .num{color:var(--green);font-weight:700;white-space:nowrap}

.warn{background:#FFF4D6;color:#7A5600;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}

</style>

const S = { data: null, lang: "uz", tab: "cust", filter: "all", q: "", view: null, hist: null, sheet: null, busy: false, toast: null };
const L = () => T[S.lang];

/* ---------- api ---------- */
async function api(action, payload = {}) {
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json", "x-init-data": tg ? tg.initData : "" },
      body: JSON.stringify({ action, ...payload }),
    });
    let j = {};
    try { j = await r.json(); } catch (_) {}
    if (!r.ok && !j.error) j.error = "server";
    return j;
  } catch (_) {
    return { error: "network" };
  }
}
async function load() {
  const d = await api("init");
  if (d.error) { S.data = { role: "error" }; render(); return; }
  S.data = d;
  S.lang = d.lang === "ru" ? "ru" : "uz";
  if (S.view) await loadHist();
  render();
}
async function loadHist() {
  const h = await api("history", { cid: S.view });
  if (h.error) { S.view = null; S.hist = null; return; }
  S.hist = h;
}

/* ---------- feedback ---------- */
let toastT;
function toast(msg, opts = {}) {
  S.toast = { msg, ...opts };
  renderLayer();
  clearTimeout(toastT);
  toastT = setTimeout(() => { S.toast = null; renderLayer(); }, opts.action ? 6000 : 2600);
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(opts.err ? "error" : "success"); } catch (_) {}
}
function errMsg(r) {
  const l = L();
  if (r.error === "badPhone") return l.badPhone;
  if (r.error === "phoneTaken") return l.phoneTaken(r.name || "");
  if (r.error === "tooMuch") return l.tooMuch(r.max || 0);
  if (r.error === "badName") return l.badName;
  if (r.error === "remSoon") return l.tRemSoon(r.hours || 1);
  if (r.error === "notLinked") return l.tNotLinked;
  if (r.error === "badCard") return l.badCard;
  if (r.error === "pending") return l.tPending;
  if (r.error === "noDebt") return l.tNoDebt;
  if (r.error === "noCard") return l.noCardC;
  if (r.error === "badAmount") return l.tooMuch(r.max || 0);
  if (r.error === "gone") return l.tGone;
  return l.err;
}

      <div class="amount num p">${a ? fm(a) : "0"} <span>${l.sum}</span></div>
      <div class="quick"><button data-a="quick" data-v="${b}">${l.all}</button></div>
      <div class="pad">${["1", "2", "3", "4", "5", "6", "7", "8", "9", "000", "0", "⌫"].map(k => `<button data-a="key" data-v="${k}" aria-label="${k === "⌫" ? "Delete" : k}">${k}</button>`).join("")}</div>
      <div class="err">${esc(err)}</div>
      <button class="main p" data-a="claimpay" ${a > 0 && a <= b && !S.busy ? "" : "disabled"}>${a > 0 ? l.paidBtn(a) : l.enter}</button></div>`;
  }
  if (sh.kind === "phone") {
    const c = S.hist.customer;
    return `<div class="sheet" role="dialog" aria-label="${l.phoneTitle}"><div class="grab"></div><h3>${l.phoneTitle}</h3><div class="who">${esc(c.name)}</div>
      <input class="inp num" id="phoneinp" inputmode="tel" placeholder="${l.phonePh}" value="${esc(sh.val ?? fmtPhone(c.phone))}" maxlength="20" autocomplete="off"><div class="err">${esc(sh.err || "")}</div>
      <button class="main" data-a="savephone" ${S.busy ? "disabled" : ""}>${l.save}</button></div>`;
  }
  if (sh.kind === "del") {
    const c = S.hist.customer;
    return `<div class="sheet" role="dialog" aria-label="${l.delTitle}"><div class="grab"></div><h3>${l.delTitle}</h3><p style="margin:0">${esc(c.balance > 0 ? l.delDebt(c.name, c.balance) : l.delAsk(c.name))}</p>
      <button class="main d" data-a="dodel" ${S.busy ? "disabled" : ""}>${l.yesDel}</button><button class="ghost" data-a="close">${l.cancel}</button></div>`;
  }
  if (sh.kind === "invite") {
    return `<div class="sheet" role="dialog" aria-label="${l.invTitle}"><div class="grab"></div><h3>${l.invTitle}</h3><div class="who">${esc(S.hist.customer.name)}</div>
      <div class="link" id="invlink">${esc(S.hist.link)}</div><p style="margin:0;color:var(--muted);font-size:13px">${l.invText}</p>
      <button class="main" data-a="share">${l.share}</button><button class="ghost" data-a="copy">${l.copy}</button></div>`;
  }
  const cs = S.data.customers;
  const c = sh.cid ? (cs.find(x => x.id === sh.cid) || (S.hist && S.hist.customer.id === sh.cid ? S.hist.customer : null)) : null;
  if (!c) {
    const list = [...cs].sort((a, b) => String(b.last).localeCompare(String(a.last)));
    return `<div class="sheet" role="dialog" aria-label="${l.shPick}"><div class="grab"></div><h3>${l.shPick}</h3>
      <div class="newbox"><b>${l.newTitle}</b><input class="inp" id="newname" placeholder="${l.newPh}" maxlength="60" value="${esc(sh.nn || "")}" autocomplete="off"><input class="inp num" id="newphone" placeholder="${l.phonePh}" inputmode="tel" maxlength="20" value="${esc(sh.np || "")}" autocomplete="off"><div class="err">${esc(sh.err || "")}</div><button class="main" data-a="newc" ${S.busy ? "disabled" : ""}>${l.add}</button></div>
      <div class="picklist">${list.map(x => `<button data-a="pick" data-v="${x.id}"><span>${esc(x.name)}${x.phone ? `<br><small class="num">${fmtPhone(x.phone)}</small>` : ""}</span><span class="num" style="color:${x.balance > 0 ? "var(--red)" : "var(--green)"}">${fm(Math.max(0, x.balance))}</span></button>`).join("")}</div></div>`;
  }
  const b = c.balance, isPay = sh.kind === "pay", a = Number(sh.amt || 0);
  const half = Math.round(b / 2 / 1000) * 1000;
  const quick = isPay ? [[l.all, b], [fm(half), half]].filter(q => q[1] > 0 && (q[0] === l.all || q[1] < b)) : [["5 000", 5000], ["10 000", 10000], ["20 000", 20000], ["50 000", 50000], ["100 000", 100000]];
  const err = sh.err || (isPay && a > b ? l.tooMuch(b) : "");
  return `<div class="sheet" role="dialog" aria-label="${isPay ? l.shPay : l.shDebt}"><div class="grab"></div>
    <h3>${isPay ? l.shPay : l.shDebt}</h3><div class="who">${esc(c.name)} · ${fm(Math.max(0, b))} ${l.sum}</div>
    <div class="amount num ${isPay ? "p" : "d"}">${a ? fm(a) : "0"} <span>${l.sum}</span></div>
    <div class="quick">${quick.map(q => `<button data-a="quick" data-v="${q[1]}">${q[0]}</button>`).join("")}</div>
    <div class="pad">${["1", "2", "3", "4", "5", "6", "7", "8", "9", "000", "0", "⌫"].map(k => `<button data-a="key" data-v="${k}" aria-label="${k === "⌫" ? "Delete" : k}">${k}</button>`).join("")}</div>
    ${isPay ? "" : `<input class="inp" id="note" placeholder="${l.notePh}" maxlength="120" value="${esc(sh.note || "")}" autocomplete="off">`}
    <div class="err">${esc(err)}</div>
    <button class="main ${isPay ? "p" : "d"}" data-a="save" ${a > 0 && !(isPay && a > b) && !S.busy ? "" : "disabled"}>${a > 0 ? (isPay ? l.saveP(a) : l.saveD(a)) : l.enter}</button></div>`;
}

function render() {
  document.documentElement.lang = S.lang;
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId && document.activeElement.selectionStart;
  $("#app").innerHTML = page();
  if (focusId === "q" && $("#q")) { $("#q").focus(); try { $("#q").setSelectionRange(caret, caret); } catch (_) {} }
  renderLayer();
  syncBack();
}
function renderLayer() {
  const keep = {};
  ["note", "newname", "newphone", "phoneinp", "cardinp", "holderinp"].forEach(id => { const el = $("#" + id); if (el) keep[id] = el.value; });
  let html = "";
  if (S.sheet && S.data && (S.data.role === "owner" || S.sheet.kind === "cpay")) html += `<div class="scrim" data-a="close"></div>` + sheetView();
  if (S.toast) html += `<div class="toast ${S.toast.err ? "err" : ""}" role="status"><span>${esc(S.toast.msg)}</span>${S.toast.action ? `<button data-a="${S.toast.action}" data-v="${esc(S.toast.v || "")}">${esc(S.toast.label)}</button>` : ""}</div>`;
  $("#layer").innerHTML = html;
  Object.entries(keep).forEach(([id, v]) => { const el = $("#" + id); if (el && !el.value) el.value = v; });
}
function syncBack() {
  if (!tg || !tg.BackButton) return;
  if (S.sheet || S.view) tg.BackButton.show(); else tg.BackButton.hide();
}
function goBack() {
  if (S.sheet) { S.sheet = null; renderLayer(); syncBack(); return; }
  if (S.view) { S.view = null; S.hist = null; render(); window.scrollTo(0, 0); }
}

/* ---------- actions ---------- */
function readSheetInputs() {
  const sh = S.sheet; if (!sh) return;
  if ($("#note")) sh.note = $("#note").value;
  if ($("#newname")) sh.nn = $("#newname").value;
  if ($("#newphone")) sh.np = $("#newphone").value;
  if ($("#phoneinp")) sh.val = $("#phoneinp").value;
  if ($("#cardinp")) sh.card = $("#cardinp").value;
  if ($("#holderinp")) sh.holder = $("#holderinp").value;
}
async function run(fn) { if (S.busy) return; S.busy = true; renderLayer(); try { await fn(); } finally { S.busy = false; renderLayer(); } }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if (!t || t.disabled) return;
  const a = t.dataset.a, v = t.dataset.v, l = L();
  readSheetInputs();
  switch (a) {
    case "reload": S.data = null; render(); load(); break;
    case "lang": S.lang = v; render(); api("setLang", { lang: v }); break;
    case "tab": S.tab = v; render(); break;
    case "filter": S.filter = v; render(); break;
    case "open": S.view = v; S.hist = null; $("#app").innerHTML = `<div class="spin"></div>`; await loadHist(); render(); window.scrollTo(0, 0); break;
    case "sheet": S.sheet = { kind: v, cid: t.dataset.c || null, amt: "", note: "" }; renderLayer(); syncBack(); break;
    case "close": S.sheet = null; renderLayer(); syncBack(); break;
    case "pick": S.sheet.cid = v; S.sheet.err = ""; renderLayer(); break;
    case "key": { let s = String(S.sheet.amt || ""); s = v === "⌫" ? s.slice(0, -1) : (s + v).replace(/^0+/, ""); if (s.length > 10) return; S.sheet.amt = s; S.sheet.err = ""; renderLayer(); break; }
    case "quick": S.sheet.amt = String(v); S.sheet.err = ""; renderLayer(); break;
    case "newc": await run(async () => {
      const sh = S.sheet, name = (sh.nn || "").trim().replace(/\s+/g, " ");
      if (!name) { sh.err = l.badName; return; }
      if (!normPhone(sh.np || "")) { sh.err = l.badPhone; return; }
      const r = await api("addCustomer", { name, phone: sh.np });
      if (r.error) { sh.err = errMsg(r); return; }
      S.data.customers.push(r.customer); sh.cid = r.customer.id; sh.err = "";
    }); break;
    case "save": await run(async () => {
      const sh = S.sheet, n = Number(sh.amt);
      const r = await api("addEntry", { cid: sh.cid, kind: sh.kind, amount: n, note: sh.kind === "debt" ? (sh.note || "") : "" });
      if (r.error) { sh.err = errMsg(r); return; }
      S.sheet = null;
      toast(sh.kind === "pay" ? l.tPaid : (r.notified ? l.tSaved : l.tSavedOff), { action: "undoLast", v: r.entryId, label: l.undo });
      await load();
    }); break;
    case "undoLast":
    case "undo": await run(async () => {
      const r = await api("undo", { eid: v });
      if (r.error && r.error !== "gone") { toast(errMsg(r), { err: true }); return; }
      toast(l.tUndo); await load();
    }); break;
    case "remind": await run(async () => {
      const r = await api("remind", { cid: S.view });
      if (r.error) toast(errMsg(r), { err: true }); else toast(l.tRem);
    }); break;
    case "invite": S.sheet = { kind: "invite" }; renderLayer(); syncBack(); break;
    case "share": {
      const url = `https://t.me/share/url?url=${encodeURIComponent(S.hist.link)}&text=${encodeURIComponent(l.shareText(S.data.shop.name))}`;
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
      break;
    }
    case "copy": try { await navigator.clipboard.writeText(S.hist.link); toast(l.tCopied); } catch (_) { const el = $("#invlink"); if (el) window.getSelection().selectAllChildren(el); } break;
    case "phone": S.sheet = { kind: "phone" }; renderLayer(); syncBack(); const pi = $("#phoneinp"); if (pi) pi.focus(); break;
    case "savephone": await run(async () => {
      const sh = S.sheet;
      if (!normPhone(sh.val || "")) { sh.err = l.badPhone; return; }
      const r = await api("setPhone", { cid: S.view, phone: sh.val });
      if (r.error) { sh.err = errMsg(r); return; }
      S.sheet = null; toast(l.tPhone); await load();
    }); break;
    case "askdel": S.sheet = { kind: "del" }; renderLayer(); syncBack(); break;
    case "dodel": await run(async () => {
      const cid = S.view;
      const r = await api("delete", { cid });
      if (r.error) { toast(errMsg(r), { err: true }); return; }
      S.sheet = null; S.view = null; S.hist = null;
      toast(l.tDeleted, { action: "restore", v: cid, label: l.restore });
      await load();
    }); break;
    case "restore": await run(async () => {
      const r = await api("restore", { cid: v });
      if (r.error) { toast(errMsg(r), { err: true }); return; }
      toast(l.tRestored); await load();
    }); break;
    case "cardsheet": S.sheet = { kind: "card" }; renderLayer(); syncBack(); break;
    case "savecard": await run(async () => {
      const sh = S.sheet, d = String(sh.card || "").replace(/[\s-]/g, "");
      if (!CARD_RE.test(d)) { sh.err = l.badCard; return; }
      const r = await api("setCard", { card: d, holder: (sh.holder || "").trim() });
      if (r.error) { sh.err = errMsg(r); return; }
      S.sheet = null; toast(l.tCard); await load();
    }); break;
    case "rmcard": await run(async () => {
      const r = await api("removeCard");
      if (r.error) { toast(errMsg(r), { err: true }); return; }
      S.sheet = null; toast(l.tCardRm); await load();
    }); break;
    case "decide": await run(async () => {
      const ok = t.dataset.ok === "1";
      const r = await api("decideClaim", { id: v, ok });
      if (r.error) toast(errMsg(r), { err: true });
      else toast(ok ? (r.status === "noDebt" ? l.tGone : l.tOk) : l.tNo, ok && r.entryId ? { action: "undoLast", v: r.entryId, label: l.undo } : {});
      await load();
    }); break;
    case "cpay": S.sheet = { kind: "cpay", cid: v, amt: "" }; renderLayer(); syncBack(); break;
    case "copycard": try { await navigator.clipboard.writeText(v); toast(l.tCardCopied); } catch (_) { const el = $("#cardno"); if (el) window.getSelection().selectAllChildren(el); } break;
    case "claimpay": await run(async () => {
      const sh = S.sheet, n = Number(sh.amt);
      const r = await api("payClaim", { cid: sh.cid, amount: n });
      if (r.error) { sh.err = errMsg(r); if (r.error === "pending") { S.sheet = null; toast(l.tPending, { err: true }); await load(); } return; }
      S.sheet = null; toast(l.tClaim); await load();
    }); break;
    case "createShop": {
      const name = ($("#shopname").value || "").trim();
      if (!name) { $("#shoperr").textContent = l.badName; return; }
      t.disabled = true;
      const r = await api("createShop", { name });
      if (r.error && r.error !== "exists") { $("#shoperr").textContent = l.err; t.disabled = false; return; }
      S.data = null; render(); await load(); break;
    }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; render(); }
});

/* ---------- boot ---------- */
(function boot() {
  if (tg) {
    try {
      tg.ready(); tg.expand();
      document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
      tg.onEvent("themeChanged", () => { document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light"; });
      tg.BackButton.onClick(goBack);
      if (tg.setHeaderColor) tg.setHeaderColor(tg.colorScheme === "dark" ? "#22356B" : "#2B4C9B");
    } catch (_) {}
  }
  const lc = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "";
  S.lang = String(lc).startsWith("ru") ? "ru" : "uz";
  if (!tg || !tg.initData) { render(); return; }
  load();
})();
</script>
</body>
</html>
